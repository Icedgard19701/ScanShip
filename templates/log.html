{% extends "base.html" %}

{% block body %}
<section class="screen active" id="screen-log">
  <div class="screen-body">
    <div class="page-head">
      <div class="page-head-text">
        <h1 class="page-title">Scan Log</h1>
        <p class="page-subtitle">Every unit shipped in the last two months, scanned or still pending.</p>
      </div>
      {# LIR's search: an icon that opens on hover or focus, x to clear. #}
      <label class="search tuck"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg><input id="log-search" type="text" inputmode="text"
             autocomplete="off" spellcheck="false" aria-label="Search the scan log"
             placeholder="Order, shipment or SKU…"><button type="button" class="search-x"
             aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></label>
    </div>
    <div class="fill log-main" id="log-main"></div>
  </div>
  <div class="actions">
    <span class="pager-total" id="pager-total"></span>
    <div class="pager">
      <button class="btn btn-secondary pager-btn" id="page-prev" type="button" disabled>
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Prev
      </button>
      <span class="pager-info" id="pager-info"></span>
      <button class="btn btn-secondary pager-btn" id="page-next" type="button" disabled>
        Next<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ base_url }}/static/js/log.js?v={{ asset_v }}"></script>
{% endblock %}
