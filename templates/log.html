<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SoShipScan — Scan Log</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy:       #1C3D5A;
            --navy-dark:  #152E45;
            --navy-light: #2A5278;
            --white:      #FFFFFF;
            --gray-50:    #F8F9FA;
            --gray-100:   #F1F3F5;
            --gray-200:   #DEE2E6;
            --gray-300:   #CED4DA;
            --gray-400:   #ADB5BD;
            --gray-500:   #868E96;
            --gray-700:   #495057;
            --gray-900:   #212529;
            --green:      #2E9E5E;
            --red:        #DC3545;
            --green-bg:   #EBF8F1;
            --red-bg:     #FFF0F0;

            --sat: env(safe-area-inset-top,    0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left,   0px);
            --sar: env(safe-area-inset-right,  0px);
        }

        /* ---- ROOT SHELL ---- */
        html {
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--gray-900);
            background: var(--white);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-top:    var(--sat);
            padding-bottom: var(--sab);
            padding-left:   var(--sal);
            padding-right:  var(--sar);
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }

        /* ---- FRAME ---- */
        .app-frame {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: var(--white);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ---- HEADER — 100% identical spec to index.html ---- */
        .header {
            background: var(--navy);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
            height: 56px;
            flex-shrink: 0;
        }
        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            flex-shrink: 0;
        }
        .header-icon:active { background: rgba(255,255,255,0.12); }
        .header-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--white);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .header-logo { display: flex; align-items: center; }
        .header-logo-img {
            height: 30px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        /* ---- APP BODY — flex column, no page scroll ---- */
        .app-body {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--white);
        }

        /* ---- TOOLBAR ---- */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 16px 0;
            flex-shrink: 0;
        }
        .toolbar-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-900);
            white-space: nowrap;
        }
        .toolbar-subtitle {
            font-size: 11px;
            color: var(--gray-500);
            margin-top: 2px;
        }

        .search-row {
            display: flex;
            border: 2px solid var(--gray-300);
            border-radius: 10px;
            overflow: hidden;
            background: var(--white);
            flex: 1;
            max-width: 320px;
        }
        .search-row:focus-within { border-color: var(--navy); }
        .search-input {
            flex: 1;
            min-width: 0;
            padding: 0 12px;
            height: 44px;
            border: none;
            font-size: 16px;
            font-family: inherit;
            font-weight: 500;
            outline: none;
            background: transparent;
            color: var(--gray-900);
        }
        .search-input::placeholder { color: var(--gray-400); font-weight: 400; }
        .btn-search {
            width: 46px;
            height: 44px;
            background: var(--navy);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-search svg {
            width: 18px;
            height: 18px;
            stroke: var(--white);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn-search:active { background: var(--navy-dark); }

        /* Stack toolbar on very small phones */
        @media (max-width: 479px) {
            .toolbar { flex-direction: column; align-items: stretch; gap: 10px; }
            .search-row { max-width: 100%; }
        }

        /* ---- RESULTS BAR ---- */
        .results-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px 8px;
            flex-shrink: 0;
        }
        .results-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--gray-700);
        }
        .results-meta { font-size: 11px; font-weight: 600; color: var(--gray-500); }
        .results-meta .spinner-inline {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--gray-200);
            border-top-color: var(--navy);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }

        /* ---- TABLE WRAPPER — fills remaining body height, no vertical scroll ---- */
        .table-wrap {
            flex: 1;
            min-height: 0;
            overflow-x: auto;
            overflow-y: hidden;   /* calcLimit() sizes rows to fit exactly */
            -webkit-overflow-scrolling: touch;
            padding: 0 16px;
        }

        table {
            width: 100%;
            min-width: 640px;
            border-collapse: collapse;
            font-size: 12px;
            /* Fixed layout — column widths come from <colgroup>, never from cell
               content, so they stay put across searches, sorts and pages. */
            table-layout: fixed;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        thead tr { background: var(--navy); }
        thead th {
            padding: 10px 12px;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: rgba(255,255,255,0.85);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        thead th:hover { background: var(--navy-light); }
        .sort-arrow { display: inline-block; margin-left: 3px; opacity: 0.35; font-size: 9px; }
        thead th.sort-asc  .sort-arrow,
        thead th.sort-desc .sort-arrow { opacity: 1; }

        tbody tr { border-bottom: 1px solid var(--gray-100); transition: background 0.12s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--gray-50); }
        tbody td {
            padding: 9px 12px;
            color: var(--gray-900);
            white-space: nowrap;
            vertical-align: middle;
            /* table-layout:fixed can't grow a column — clip instead of overflowing */
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* The empty-state / error row spans all columns and must not be clipped */
        tbody td[colspan] { overflow: visible; text-align: center; }
        tbody td.dim { color: var(--gray-500); }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .badge-scanned { background: var(--green-bg); color: var(--green); }
        .badge-scanned .badge-dot { background: var(--green); }
        .badge-pending { background: var(--gray-100); color: var(--gray-500); }
        .badge-pending .badge-dot { background: var(--gray-400); }

        /* ---- SKELETON ---- */
        .skel td { padding: 10px 12px; }
        .skel-bar {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }

        /* ---- EMPTY STATE ---- */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--gray-400);
            font-size: 13px;
            line-height: 1.6;
        }
        .empty-state svg {
            width: 44px; height: 44px;
            stroke: var(--gray-300);
            fill: none; stroke-width: 1;
            stroke-linecap: round; stroke-linejoin: round;
            margin: 0 auto 10px;
            display: block;
        }

        /* ---- PAGINATION ---- */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .pg-btn {
            height: 36px;
            padding: 0 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            background: var(--white);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            color: var(--gray-700);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            -webkit-tap-highlight-color: transparent;
            transition: border-color 0.15s, background 0.15s;
        }
        .pg-btn:hover:not(:disabled) { border-color: var(--navy); color: var(--navy); }
        .pg-btn:active:not(:disabled) { background: var(--gray-50); }
        .pg-btn:disabled { opacity: 0.35; cursor: default; }
        .pg-btn svg {
            width: 14px; height: 14px;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .pg-info {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            white-space: nowrap;
            padding: 0 4px;
        }

        /* ---- TOAST ---- */
        .toast {
            position: fixed;
            bottom: calc(var(--sab) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 12px 22px;
            border-radius: 10px;
            color: var(--white);
            font-weight: 600;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: all 0.25s ease;
            max-width: min(85%, 340px);
            text-align: center;
            font-family: inherit;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-error { background: var(--red); }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ================================================
           RESPONSIVE
           ================================================ */

        @media (min-width: 430px) {
            .header          { padding: 14px 20px; }
            .header-logo-img { height: 34px; }
            .toolbar         { padding: 20px 20px 0; }
            .results-bar     { padding: 12px 20px 8px; }
            .table-wrap      { padding: 0 20px; }
            .pagination      { padding: 12px 20px; }
        }

        /* Tablets & desktop — centered card, no scroll anywhere */
        @media (min-width: 768px) {
            body {
                background: var(--white);
                padding: 0;
                align-items: center;
                justify-content: center;
            }
            .app-frame {
                width: clamp(700px, 85vw, 1150px);
                height: 85dvh;
                max-height: 800px;
                flex: none;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 8px 40px rgba(0,0,0,0.18);
            }
            .app-body {
                border-bottom-left-radius: 20px;
                border-bottom-right-radius: 20px;
            }
            .header          { padding: 14px 24px; }
            .header-logo-img { height: 36px; }
            .toolbar         { padding: 20px 24px 0; }
            .results-bar     { padding: 12px 24px 8px; }
            .table-wrap      { padding: 0 24px; }
            .pagination      { padding: 12px 24px; }
            .toolbar-title   { font-size: 20px; }
            table            { min-width: 0; width: 100%; }
        }
    </style>
</head>

        <!-- Right: Scan Log (keeps header symmetric) -->
        <a href="{{ base_url }}/log" class="header-icon" title="Scan Log" style="text-decoration:none;">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="3" y1="15" x2="21" y2="15"/>
                <line x1="9" y1="9" x2="9" y2="21"/>
            </svg>
        </a>

    <!-- ========== APP BODY ========== -->
    <div class="app-body">

        <div class="toolbar">
            <div>
                <div class="toolbar-title">Scan Log</div>
                <div class="toolbar-subtitle">History · AcuSoShipScanLog</div>
            </div>
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input"
                       placeholder="Order, Shipment or SKU…"
                       autocomplete="off" inputmode="text">
                <button class="btn-search" onclick="triggerSearch()">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="results-bar">
            <div class="results-label">Records</div>
            <div class="results-meta" id="resultsMeta">Loading…</div>
        </div>

        <div class="table-wrap">
            <table id="logTable">
                <!-- Fixed column proportions — keep in sync with COLS order -->
                <colgroup>
                    <col style="width: 11%">   <!-- Status        -->
                    <col style="width: 17%">   <!-- Scan Date     -->
                    <col style="width: 14%">   <!-- Order Nbr.    -->
                    <col style="width: 15%">   <!-- Shipment Nbr. -->
                    <col style="width: 12%">   <!-- Ship. Date    -->
                    <col style="width: 18%">   <!-- Item / SKU    -->
                    <col style="width: 13%">   <!-- Acu. Status   -->
                </colgroup>
                <thead>
                    <tr>
                        <th data-col="ScanStatus"   class="sort-desc">Status <span class="sort-arrow">&#9660;</span></th>
                        <th data-col="ScanDate">Scan Date <span class="sort-arrow">&#9660;</span></th>
                        <th data-col="OrderNbr">Order Nbr. <span class="sort-arrow">&#9660;</span></th>
                        <th data-col="ShipmentNbr">Shipment Nbr. <span class="sort-arrow">&#9660;</span></th>
                        <th data-col="ShipmentDate">Ship. Date <span class="sort-arrow">&#9660;</span></th>
                        <th data-col="InventoryID">Item / SKU <span class="sort-arrow">&#9660;</span></th>
                        <th data-col="Status">Acu. Status <span class="sort-arrow">&#9660;</span></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="pagination" id="paginationBar">
            <button class="pg-btn" id="btnPrev" onclick="goPage(currentPage - 1)" disabled>
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                Prev
            </button>
            <div class="pg-info" id="pgInfo">—</div>
            <button class="pg-btn" id="btnNext" onclick="goPage(currentPage + 1)" disabled>
                Next
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </div>

    </div><!-- /app-body -->
</div><!-- /app-frame -->

<div id="toast" class="toast"></div>

<script>
    // ---- Config ----
    var API_KEY = 'SWCORP-SCAN-2026';

    // ---- API helper ----
    var BASE_URL = '{{ base_url }}';
    function apiFetch(url, options) {
        options = options || {};
        options.headers = Object.assign({}, options.headers, { 'X-API-Key': API_KEY });
        return fetch(BASE_URL + url, options);
    }

    // ---- State ----
    var currentPage  = 1;
    var totalPages   = 1;
    var totalRecords = 0;
    var currentQ     = '';
    var sortCol      = 'ScanDate';
    var sortDir      = 'desc';
    var debounceTimer;
    var resizeTimer;

    var LIMIT        = 10;   // initial safe default; recalculated after first paint
    var ROW_H        = 37;   // updated to real measured height after first render
    var SAFETY_PX    = 4;    // extra buffer so no row is ever partially visible

    // ---- Dynamic page limit ----
    // Measures the exact rendered height of a real <tr> and the table wrapper,
    // then returns the max rows that fit with zero partial-row visibility.
    // Minimum 10 rows.
    function calcLimit() {
        // Measure real row height from a rendered row (most accurate)
        var firstRow = document.querySelector('tbody tr');
        if (firstRow) {
            ROW_H = firstRow.getBoundingClientRect().height;
        }

        var wrap = document.querySelector('.table-wrap');
        if (!wrap) {
            // Pre-paint fallback
            var chrome = 56 + 62 + 40 + 52 + 38;
            var avail  = window.innerHeight - chrome - 8 - SAFETY_PX;
            return Math.max(10, Math.floor(avail / ROW_H));
        }

        var wrapH  = wrap.getBoundingClientRect().height;
        var thead  = document.querySelector('thead');
        var theadH = thead ? thead.getBoundingClientRect().height : 38;
        var avail  = wrapH - theadH - SAFETY_PX;

        return Math.max(10, Math.floor(avail / ROW_H));
    }

    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            var next = calcLimit();
            if (next !== LIMIT) {
                LIMIT = next;
                currentPage = 1;
                loadLog();
            }
        }, 350);
    });

    var COLS = [
        { key: 'ScanStatus',   label: 'Status' },
        { key: 'ScanDate',     label: 'Scan Date' },
        { key: 'OrderNbr',     label: 'Order Nbr.' },
        { key: 'ShipmentNbr',  label: 'Shipment Nbr.' },
        { key: 'ShipmentDate', label: 'Ship. Date' },
        { key: 'InventoryID',  label: 'Item / SKU' },
        { key: 'Status',       label: 'Acu. Status' },
    ];

    // ---- Toast ----
    function showToast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast toast-' + type + ' show';
        setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    // ---- Search ----
    document.getElementById('searchInput').addEventListener('input', function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function() {
            currentQ    = document.getElementById('searchInput').value.trim();
            currentPage = 1;
            loadLog();
        }, 400);
    });

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            clearTimeout(debounceTimer);
            currentQ    = this.value.trim();
            currentPage = 1;
            loadLog();
        }
    });

    function triggerSearch() {
        clearTimeout(debounceTimer);
        currentQ    = document.getElementById('searchInput').value.trim();
        currentPage = 1;
        loadLog();
    }

    // ---- Pagination ----
    function goPage(p) {
        if (p < 1 || p > totalPages) return;
        currentPage = p;
        loadLog();
    }

    // ---- Skeleton rows ----
    function showSkeleton() {
        var widths = [60, 110, 80, 90, 80, 100, 70];
        var rows = '';
        for (var i = 0; i < LIMIT; i++) {
            rows += '<tr class="skel">';
            widths.forEach(function(w) {
                rows += '<td><div class="skel-bar" style="width:' + w + 'px"></div></td>';
            });
            rows += '</tr>';
        }
        document.getElementById('tableBody').innerHTML = rows;
        document.getElementById('resultsMeta').innerHTML = '<span class="spinner-inline"></span>';
    }

    // ---- Fetch ----
    // silent=true → background auto-refresh, skip skeleton to avoid flicker
    async function loadLog(silent) {
        if (!silent) showSkeleton();

        var params = new URLSearchParams({
            page:     currentPage,
            limit:    LIMIT,
            sort_col: sortCol,
            sort_dir: sortDir
        });
        if (currentQ) params.append('q', currentQ);

        try {
            var res  = await apiFetch('/api/log?' + params.toString());
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var data = await res.json();

            totalPages   = data.pages || 1;
            totalRecords = data.total || 0;
            currentPage  = data.page  || 1;

            renderRows(data.logs || []);

            // After first real render, re-measure row height and adjust limit if needed.
            // This corrects any pre-paint estimate that caused a partial row to show.
            requestAnimationFrame(function() {
                var correct = calcLimit();
                if (correct !== LIMIT && !silent) {
                    LIMIT = correct;
                    loadLog(true);
                }
            });

            updatePagination();

            var from = (currentPage - 1) * LIMIT + 1;
            var to   = Math.min(currentPage * LIMIT, totalRecords);
            document.getElementById('resultsMeta').textContent =
                totalRecords === 0 ? 'No records' :
                totalRecords + ' total · showing ' + from + '–' + to;

        } catch(err) {
            if (!silent) {
                document.getElementById('tableBody').innerHTML =
                    '<tr><td colspan="7" style="padding:32px;text-align:center;color:var(--gray-400);font-size:13px;">Connection error — please try again.</td></tr>';
                document.getElementById('resultsMeta').textContent = 'Error';
                showToast('Connection error', 'error');
            }
        }
    }

    // ---- Render rows ----
    function renderRows(logs) {
        if (logs.length === 0) {
            document.getElementById('tableBody').innerHTML =
                '<tr><td colspan="7">'
                + '<div class="empty-state">'
                + '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/>'
                + '<line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/>'
                + '<line x1="9" y1="9" x2="9" y2="21"/></svg>'
                + 'No records found.'
                + '</div></td></tr>';
            return;
        }

        var html = '';
        logs.forEach(function(row) {
            html += '<tr>';
            COLS.forEach(function(col) {
                var val = row[col.key];
                if (col.key === 'ScanStatus') {
                    html += '<td>' + statusBadge(val) + '</td>';
                } else if (col.key === 'ScanDate' || col.key === 'ShipmentDate') {
                    html += '<td class="dim">' + esc(fmtDate(val)) + '</td>';
                } else if (val === null || val === undefined || val === '') {
                    html += '<td class="dim">—</td>';
                } else {
                    // title = full value, readable on hover when the cell is ellipsised
                    html += '<td title="' + esc(String(val)) + '">' + esc(String(val)) + '</td>';
                }
            });
            html += '</tr>';
        });
        document.getElementById('tableBody').innerHTML = html;
    }

    // ---- Pagination controls ----
    function updatePagination() {
        document.getElementById('btnPrev').disabled = (currentPage <= 1);
        document.getElementById('btnNext').disabled = (currentPage >= totalPages);
        document.getElementById('pgInfo').textContent = 'Page ' + currentPage + ' of ' + totalPages;
    }

    // ---- Column sort (server-side — triggers a new fetch) ----
    document.getElementById('logTable').addEventListener('click', function(e) {
        var th = e.target.closest('th[data-col]');
        if (!th) return;
        var col = th.getAttribute('data-col');
        if (sortCol === col) {
            sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
            sortCol = col;
            sortDir = 'asc';
        }

        document.querySelectorAll('thead th').forEach(function(t) {
            t.classList.remove('sort-asc', 'sort-desc');
            var arrow = t.querySelector('.sort-arrow');
            if (arrow) arrow.innerHTML = '&#9660;';
        });
        th.classList.add('sort-' + sortDir);
        var arrow = th.querySelector('.sort-arrow');
        if (arrow) arrow.innerHTML = sortDir === 'asc' ? '&#9650;' : '&#9660;';

        currentPage = 1;
        loadLog();
    });

    // ---- Helpers ----
    function statusBadge(val) {
        if (!val) return '<span class="badge badge-pending"><span class="badge-dot"></span>—</span>';
        var cls = val === 'Scanned' ? 'badge-scanned' : 'badge-pending';
        return '<span class="badge ' + cls + '"><span class="badge-dot"></span>' + esc(val) + '</span>';
    }

    function fmtDate(val) {
        if (!val) return '—';
        try {
            // Date-only (YYYY-MM-DD): render as-is, no timezone shift
            if (/^\d{4}-\d{2}-\d{2}$/.test(val)) {
                var p = val.split('-');
                return p[1] + '/' + p[2] + '/' + p[0];
            }
            // Datetime: convert to Miami time (America/New_York)
            var d = new Date(val);
            if (isNaN(d.getTime())) return val;
            var parts = new Intl.DateTimeFormat('en-US', {
                timeZone:  'America/New_York',
                year:      'numeric',
                month:     '2-digit',
                day:       '2-digit',
                hour:      '2-digit',
                minute:    '2-digit',
                hourCycle: 'h23'
            }).formatToParts(d);
            var get = function(type) {
                var found = parts.filter(function(x) { return x.type === type; });
                return found.length ? found[0].value : '00';
            };
            return get('month') + '/' + get('day') + '/' + get('year')
                   + ' ' + get('hour') + ':' + get('minute');
        } catch(e) { return val; }
    }

    function esc(s) {
        return String(s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ---- Auto-refresh ----
    var _refreshTimer = null;
    var REFRESH_MS    = 10000;   // 10 seconds

    function startRefresh() {
        if (_refreshTimer) return;
        _refreshTimer = setInterval(function() {
            loadLog(true);   // silent — no skeleton, no error toast
        }, REFRESH_MS);
    }

    function stopRefresh() {
        clearInterval(_refreshTimer);
        _refreshTimer = null;
    }

    // Pause when tab goes to background, resume (+ immediate refresh) when it comes back
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            stopRefresh();
        } else {
            loadLog(true);
            startRefresh();
        }
    });

    // Defer initial load until the browser has painted so
    // getBoundingClientRect() returns real pixel heights for calcLimit().
    requestAnimationFrame(function() {
        LIMIT = calcLimit();
        loadLog();       // first load: show skeleton
        startRefresh();  // then start polling
    });
</script>

</body>
</html>
