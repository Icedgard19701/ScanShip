<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SoShipScan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy:      #1C3D5A;
            --navy-dark: #152E45;
            --navy-light:#2A5278;
            --white:     #FFFFFF;
            --gray-50:   #F8F9FA;
            --gray-100:  #F1F3F5;
            --gray-200:  #DEE2E6;
            --gray-300:  #CED4DA;
            --gray-400:  #ADB5BD;
            --gray-500:  #868E96;
            --gray-700:  #495057;
            --gray-900:  #212529;
            --green:     #2E9E5E;
            --red:       #DC3545;

            --sat: env(safe-area-inset-top,    0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left,   0px);
            --sar: env(safe-area-inset-right,  0px);
        }

        /* ---- ROOT SHELL — locks the viewport on every device ---- */
        html {
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--gray-900);
            /* White body = safe-area padding areas are seamless on mobile */
            background: var(--white);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Fluid safe-area padding — no fixed bar offsets */
            padding-top:    var(--sat);
            padding-bottom: var(--sab);
            padding-left:   var(--sal);
            padding-right:  var(--sar);
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }

        /* ---- FRAME — fills body after safe-area padding ---- */
        .app-frame {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: var(--white);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ---- HEADER ---- */
        .header {
            background: var(--navy);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
            height: 56px;
            flex-shrink: 0;
        }
        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            flex-shrink: 0;
        }
        .header-icon:active { background: rgba(255,255,255,0.12); }
        .header-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--white);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .header-logo { display: flex; align-items: center; }
        .header-logo-img {
            height: 30px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        /* ---- APP BODY — flex column, all scroll is internal ---- */
        .app-body {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--white);
        }

        /* ---- SEARCH SECTION ---- */
        .search-section {
            padding: 20px 16px 14px;
            text-align: center;
            flex-shrink: 0;
        }
        .search-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 3px;
        }
        .search-subtitle {
            font-size: 12px;
            color: var(--gray-500);
            margin-bottom: 16px;
        }
        .search-row {
            display: flex;
            border: 2px solid var(--gray-300);
            border-radius: 10px;
            overflow: hidden;
            background: var(--white);
        }
        .search-row:focus-within { border-color: var(--navy); }
        .search-input {
            flex: 1;
            min-width: 0;
            padding: 0 14px;
            height: 48px;
            border: none;
            font-size: 16px;
            font-family: inherit;
            font-weight: 500;
            outline: none;
            background: transparent;
        }
        .search-input::placeholder { color: var(--gray-400); font-weight: 400; }
        .btn-search {
            width: 52px;
            height: 48px;
            background: var(--navy);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-search svg {
            width: 20px;
            height: 20px;
            stroke: var(--white);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn-search:active { background: var(--navy-dark); }

        /* ---- EMPTY STATE — fills remaining height, centers content ---- */
        #emptyState {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 20px;
        }
        .empty-icon { margin-bottom: 14px; }
        .empty-icon svg {
            width: 56px;
            height: 56px;
            stroke: var(--gray-300);
            fill: none;
            stroke-width: 1;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .empty-text {
            font-size: 13px;
            color: var(--gray-400);
            text-align: center;
            line-height: 1.6;
        }

        /* ---- ORDER SECTION — fills remaining height when active ---- */
        .order-section {
            display: none;
            padding: 0 14px;
        }
        .order-section.active {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .order-card {
            background: var(--navy);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .order-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .order-number {
            font-size: 15px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.2px;
        }
        .order-arrow {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: -8px -8px -8px 0;
            border-radius: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .order-arrow:active { background: rgba(255,255,255,0.1); }
        .order-arrow svg {
            width: 18px;
            height: 18px;
            stroke: var(--white);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .order-scan-input {
            width: 100%;
            padding: 0 14px;
            height: 44px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 500;
            outline: none;
            background: var(--white);
        }
        .order-scan-input::placeholder { color: var(--gray-400); font-weight: 400; }

        /* ---- ITEMS LIST ---- */
        .items-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .items-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--gray-700);
        }
        .items-counter {
            font-size: 11px;
            font-weight: 600;
            color: var(--gray-500);
        }
        /* Items list — only scrollable region on the page */
        .items-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 14px 12px;
        }
        .item-row {
            background: var(--white);
            border: 1.5px solid var(--gray-200);
            border-radius: 10px;
            padding: 11px 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.25s, background 0.25s;
            min-height: 52px;
        }
        .item-row.scanned { border-color: var(--navy); background: var(--gray-50); }
        .item-info { flex: 1; min-width: 0; }
        .item-sku {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-900);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-sub {
            font-size: 11px;
            color: var(--gray-400);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-check {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--gray-300);
            flex-shrink: 0;
            margin-left: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s, border-color 0.25s;
        }
        .item-row.scanned .item-check { background: var(--navy); border-color: var(--navy); }
        .item-check svg {
            width: 14px;
            height: 14px;
            stroke: var(--white);
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transition: opacity 0.25s;
        }
        .item-row.scanned .item-check svg { opacity: 1; }

        /* ---- SKELETON SHIMMER ---- */
        .skel-bar {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }

        /* ---- INTERACTIVE CHECK ---- */
        .item-check { cursor: pointer; }
        .item-check:active { opacity: 0.6; }

        /* ---- COMPLETED SCREEN ---- */
        .completed-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 500;
            background: var(--navy);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 24px max(32px, var(--sab));
        }
        .completed-screen.show { display: flex; }
        .completed-logo { margin-bottom: 44px; }
        .completed-logo img {
            height: 40px;
            width: auto;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }
        .completed-circle {
            width: 110px;
            height: 110px;
            background: rgba(255,255,255,0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .completed-circle-inner {
            width: 80px;
            height: 80px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .completed-circle-inner svg {
            width: 40px;
            height: 40px;
            stroke: var(--navy);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .completed-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .completed-order {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ---- TOAST ---- */
        .toast {
            position: fixed;
            top: calc(var(--sat) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 12px 22px;
            border-radius: 10px;
            color: var(--white);
            font-weight: 600;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: all 0.25s ease;
            max-width: min(85%, 340px);
            text-align: center;
            font-family: inherit;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-success { background: var(--green); }
        .toast-error   { background: var(--red); }


        /* ================================================
           RESPONSIVE
           ================================================ */

        /* Large phones (≥ 430px) — more breathing room */
        @media (min-width: 430px) {
            .header          { padding: 14px 20px; }
            .header-logo-img { height: 34px; }
            .search-section  { padding: 24px 20px 16px; }
            .search-input    { height: 52px; }
            .btn-search      { height: 52px; }
            .order-section   { padding: 0 18px; }
            .items-header    { padding: 0 18px; }
            .items-list      { padding: 0 18px 12px; }
            .order-card      { padding: 14px 16px; }
        }

        /* Tablets & desktop (≥ 768px) — centered card, no body scroll */
        @media (min-width: 768px) {
            body {
                background: var(--gray-100);
                /* Remove safe-area padding — frame is centered, not edge-to-edge */
                padding: 0;
                align-items: center;
                justify-content: center;
            }
            .app-frame {
                width: clamp(700px, 85vw, 1150px);
                height: 85dvh;
                max-height: 800px;
                flex: none;          /* override flex:1 from base */
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 8px 40px rgba(0,0,0,0.18);
            }
            .app-body {
                border-bottom-left-radius: 20px;
                border-bottom-right-radius: 20px;
            }
            /* Completed overlay scoped to the card */
            .completed-screen {
                position: absolute;
                border-radius: 20px;
            }
            /* Wider gutters + constrained search bar */
            .header          { padding: 14px 24px; }
            .header-logo-img { height: 36px; }
            .search-section  {
                padding: 28px 32px 20px;
            }
            .search-section .search-row {
                max-width: 580px;
                margin: 0 auto;
            }
            .search-input  { height: 52px; }
            .btn-search    { height: 52px; }
            .order-section.active { padding: 0 28px 16px; }
            .items-header  { padding: 0; }
            .items-list    { padding: 0 0 12px; }
            .search-title    { font-size: 20px; }
            .search-subtitle { font-size: 13px; }
            .item-sku        { font-size: 15px; }
        }
    </style>
</head>

        </div>
        <div class="completed-circle">
            <div class="completed-circle-inner">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
        </div>
        <div class="completed-title">Order Completed</div>
        <div class="completed-order" id="completedOrder"></div>
    </div>

</div><!-- /app-frame -->

<div id="toast" class="toast"></div>


<script>
    // ---- Config ----
    var API_KEY = 'SWCORP-SCAN-2026';

    // ---- State ----
    var currentOrder  = '';
    var currentOrderType = '';
    var currentUser   = 'User';
    var completedTimer = null;
    var _toggleBusy   = false;

    // ---- API helper ----
    var BASE_URL = '{{ base_url }}';
    function apiFetch(url, options) {
        options = options || {};
        options.headers = Object.assign({}, options.headers, { 'X-API-Key': API_KEY });
        return fetch(BASE_URL + url, options);
    }

    // ---- Toast ----
    function showToast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast toast-' + type + ' show';
        setTimeout(function() { t.classList.remove('show'); }, 2200);
    }

    // ---- Skeleton while search loads ----
    function showSearchSkeleton(q) {
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('orderSection').classList.add('active');
        document.getElementById('orderNumber').textContent  = q;
        document.getElementById('itemsCounter').textContent = '—';

        var widths = [130, 100, 150, 110, 90, 140];
        var html = '';
        for (var i = 0; i < 6; i++) {
            html += '<div class="item-row">'
                  + '<div class="item-info">'
                  + '<div class="skel-bar" style="width:' + widths[i] + 'px;margin-bottom:5px"></div>'
                  + '<div class="skel-bar" style="width:' + Math.round(widths[i] * 0.6) + 'px"></div>'
                  + '</div>'
                  + '<div class="item-check"></div>'
                  + '</div>';
        }
        document.getElementById('itemsList').innerHTML = html;
        document.getElementById('itemScanInput').value = '';
    }

    // ---- Search ----
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
    });

    function doSearch() {
        var val = document.getElementById('searchInput').value.trim();
        if (!val) return;
        searchOrder(val, false);
    }

    // isRefresh=true when called after a scan (skeleton already visible, don't reset on error)
    async function searchOrder(q, isRefresh) {
        if (!isRefresh) showSearchSkeleton(q);

        try {
            var res  = await apiFetch('/api/search?q=' + encodeURIComponent(q));
            var data = await res.json();

            if (!res.ok) {
                showToast(data.error || 'Error loading order', 'error');
                if (!isRefresh) resetToEmpty();
                return;
            }

            if (!data.items || data.total === 0) {
                showToast('Order not found: ' + q, 'error');
                if (!isRefresh) resetToEmpty();
                return;
            }

            if (data.done > 0 && data.done === data.total) {
                currentOrder = q;
                currentOrderType = data.items[0].OrderType || '';
                document.getElementById('searchInput').value = '';
                showCompleted();
                return;
            }

            currentOrder = q;
            currentOrderType = data.items[0].OrderType || '';
            renderOrder(data);

        } catch (err) {
            showToast('Connection error', 'error');
            if (!isRefresh) resetToEmpty();
        }
    }

    function renderOrder(data) {
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('orderSection').classList.add('active');

        var first = data.items[0];
        document.getElementById('orderNumber').textContent  = first.OrderNbr || currentOrder;
        document.getElementById('itemsCounter').textContent = data.done + '/' + data.total + ' Done';

        var html = '';
        data.items.forEach(function(item) {
            var cls       = item.scanned ? 'item-row scanned' : 'item-row';
            var qty       = parseInt(item.ShippedQty) || 1;
            var unitLabel = qty > 1 ? ' (unit ' + item.unit + ')' : '';

            // Store ScanID and scanned state as data attributes for toggle
            html += '<div class="' + cls + '" data-scan-id="' + item.ScanID + '" data-sku="' + esc(item.InventoryID || '') + '">';
            html += '  <div class="item-info">';
            html += '    <div class="item-sku">' + esc(item.InventoryID || '') + '</div>';
            html += '    <div class="item-sub">' + esc(item.OrderNbr || '') + unitLabel + '</div>';
            html += '  </div>';
            html += '  <div class="item-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>';
            html += '</div>';
        });

        document.getElementById('itemsList').innerHTML = html;
        document.getElementById('itemScanInput').value = '';
        document.getElementById('itemScanInput').focus();
    }

    // ---- Item Scanning (barcode / Enter key) ----
    document.getElementById('itemScanInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            var sku = this.value.trim();
            if (sku) scanItem(sku);
        }
    });

    async function scanItem(sku) {
        try {
            var res = await apiFetch('/api/scan', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ OrderNbr: currentOrder, OrderType: currentOrderType, InventoryID: sku, ScanUser: currentUser })
            });
            var data = await res.json();

            if (res.ok) {
                showToast(data.sku + ' scanned', 'success');
                if (data.completed) { showCompleted(); return; }
                await searchOrder(currentOrder, true);
            } else {
                showToast(data.error || 'Scan error', 'error');
            }
        } catch (err) {
            showToast('Connection error', 'error');
        }
        document.getElementById('itemScanInput').value = '';
        document.getElementById('itemScanInput').focus();
    }

    // ---- Interactive check circles (tap to toggle) ----
    document.getElementById('itemsList').addEventListener('click', function(e) {
        var check = e.target.closest('.item-check');
        if (!check) return;
        var row     = check.closest('.item-row');
        if (!row)   return;
        var scanId  = parseInt(row.dataset.scanId);
        var sku     = row.dataset.sku;
        var scanned = row.classList.contains('scanned');
        toggleItem(scanId, sku, scanned);
    });

    async function toggleItem(scanId, sku, currentlyScanned) {
        if (_toggleBusy) return;
        _toggleBusy = true;
        try {
        if (currentlyScanned) {
            // Unmark → Pending
            try {
                var res  = await apiFetch('/api/unscan', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ ScanID: scanId, OrderNbr: currentOrder, OrderType: currentOrderType })
                });
                var data = {};
                try { data = await res.json(); } catch (_) {}
                if (res.ok) {
                    showToast(sku + ' unmarked', 'error');
                    await searchOrder(currentOrder, true);
                } else {
                    showToast(data.error || 'Error ' + res.status, 'error');
                }
            } catch (err) {
                showToast('Connection error', 'error');
            }
        } else {
            // Mark → Scanned (same as barcode scan)
            await scanItem(sku);
        }
        } finally {
            _toggleBusy = false;
        }
        document.getElementById('itemScanInput').focus();
    }

    // ---- Helpers ----
    function esc(s) {
        return String(s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ---- Completed Screen ----
    function showCompleted() {
        document.getElementById('completedOrder').textContent = currentOrder;
        document.getElementById('completedScreen').classList.add('show');
        // Hide keyboard while the completed screen is visible
        document.activeElement && document.activeElement.blur();
        completedTimer = setTimeout(dismissCompleted, 3000);
    }

    function dismissCompleted() {
        if (completedTimer) { clearTimeout(completedTimer); completedTimer = null; }
        document.getElementById('completedScreen').classList.remove('show');
        resetToEmpty();
        // Return focus to OrderNbr field so scanner is ready for next order
        document.getElementById('searchInput').focus();
    }

    function resetToEmpty() {
        currentOrder = '';
        document.getElementById('emptyState').style.display = '';
        document.getElementById('orderSection').classList.remove('active');
        document.getElementById('searchInput').value = '';
        document.getElementById('searchInput').focus();
    }
</script>
